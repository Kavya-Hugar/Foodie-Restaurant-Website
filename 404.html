<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | Foodie Restaurant</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }

        .error-page h1 {
            font-size: 100px;
            color: #ff8c32;
            margin: 0;
        }

        .error-page h2 {
            font-size: 30px;
            margin: 10px 0;
        }

        .error-page p {
            color: #ccc;
            margin-bottom: 25px;
        }

        .error-page a {
            display: inline-block;
            background: #ff8c32;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
        }

        .error-page a:hover {
            background: #e66f16;
        }
    </style>
</head>

<body>

    <div class="error-page">

        <h1>404</h1>

        <h2>Oops! Page Not Found</h2>

        <p>Sorry, the page you are looking for doesn't exist.</p>

        <a href="index.html">Back to Home</a>

    </div>

</body>
</html>
